        <!--
            Load all pages necessary for experiment:
                - Consent Page
                - Instructions
                - Comprehension Quiz
                - Experiment
                - Completed Page
        -->
        <script>
            $(document).ready(function(){
                // Use settings from global settings object
                const debugMode = window.experimentSettings.debug;
                const freshMode = window.experimentSettings.fresh;
                
                // Fresh mode: Clear all storage to simulate a fresh participant
                if (freshMode) {
                    console.log('🆕 Fresh mode: Clearing all experiment data at entry point');
                    
                    // Check if this is the first time we're seeing the fresh parameter
                    const alreadyFreshed = sessionStorage.getItem('freshModeApplied');
                    
                    if (!alreadyFreshed) {
                        // First time seeing fresh=true, need to clear and reload
                        console.log('🧹 Clearing all localStorage and sessionStorage');
                        
                        // Clear all storage
                        localStorage.clear();
                        sessionStorage.clear();
                        
                        // Set a flag so we know we've already done the fresh clear
                        sessionStorage.setItem('freshModeApplied', 'true');
                        
                        // Remove fresh parameter from URL and reload with cache-busting
                        const newUrl = new URL(window.location);
                        newUrl.searchParams.delete('fresh');
                        newUrl.searchParams.set('_t', Date.now());
                        
                        console.log('🔄 Reloading page with fresh cache...');
                        window.location.href = newUrl.toString();
                        return; // Stop execution, page will reload
                    } else {
                        // Second time through (after reload), clean up
                        console.log('✅ Fresh mode applied successfully');
                        sessionStorage.removeItem('freshModeApplied');
                        
                        // Remove the cache-busting parameter from URL
                        const newUrl = new URL(window.location);
                        newUrl.searchParams.delete('_t');
                        if (newUrl.search !== window.location.search) {
                            window.history.replaceState({}, '', newUrl);
                        }
                    }
                }
                
                // Pre-load models immediately when page loads
                if (typeof preloadModels === 'function') {
                    preloadModels();
                }
                
                if (debugMode){
                    // Debug mode - skip directly to pre-survey
                    $("#consent-main-content").attr("hidden", true);
                    $("#task-main-content").attr("hidden", false);
                    $('#task-main-content').load('html/pre-survey.html?v=' + Date.now());
                } else{
                    // Production mode - start with consent
                    $('#consent-main-content').load("html/consent.html?v=" + Date.now());
                }

                // ── ROUTING FUNCTIONS (Two-Session MBA/MBE Design) ─────────────────────
                //
                // Flow: Consent → Instructions → Pre-Survey →
                //   Session 1: PromptReading → MBA → Chat → MBE →
                //   SessionTransition →
                //   Session 2: PromptReading → MBA → Chat → MBE →
                //   FinalSurvey → Complete

                // Called by instructions.js after overview screen
                window.showPreSurvey = function() {
                    $("#instructions-main-content").attr("hidden", true);
                    $("#task-main-content").attr("hidden", false);
                    $('#task-main-content').load('html/pre-survey.html?v=' + Date.now());
                };

                // Called by pre-survey after submit — shows prompt reading for current session
                window.showPromptReading = function() {
                    $('#task-main-content').load('html/prompt-reading.html?v=' + Date.now());
                };

                // Called by prompt-reading after all sentences revealed — shows MBA trait rating
                window.showMBA = function() {
                    $('#task-main-content').load('html/mba-trait-rating.html?v=' + Date.now());
                };

                // Called by MBA after submit — loads live chat
                window.showChat = function() {
                    $('#task-main-content').load('html/chat-content.html?v=' + Date.now());
                };

                // Called by chat.js completePostSurvey — shows MBE trait rating
                window.showMBE = function() {
                    $('#task-main-content').load('html/mbe-trait-rating.html?v=' + Date.now());
                };

                // Called by MBE after Session 1 submit — transition screen before Session 2
                window.showSessionTransition = function() {
                    $('#task-main-content').load('html/session-transition.html?v=' + Date.now());
                };

                // Called by MBE after Session 2 submit — final survey
                window.showFinalSurvey = function() {
                    $('#task-main-content').load('html/task4-final.html?v=' + Date.now());
                };

                // Legacy aliases for backward compatibility during migration
                window.showTask1 = window.showPreSurvey;
                window.showTask4 = window.showFinalSurvey;
                window.showTask2Chat = window.showChat;
                window.showChatInterface = window.showChat;
            });
        </script>
