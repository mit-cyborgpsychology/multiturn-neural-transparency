<!-- MBE: Model Behavior Evaluation (trait rating after interaction) -->
<div class="mbe-container" style="max-width: 800px; margin: 0 auto; padding: 1.5rem;">

    <!-- Header -->
    <div style="margin-bottom: 1.5rem;">
        <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 16px 20px; border-radius: 8px; color: white; margin-bottom: 1rem;">
            <h4 id="mbeTitle" style="margin: 0 0 4px 0; font-size: 1.1rem;"></h4>
            <p style="margin: 0; font-size: 0.875rem; opacity: 0.9;">Now that you've observed the chatbot's behavior, rate the activation level (-10 to +10) for each trait.</p>
        </div>
    </div>

    <!-- System prompt reminder -->
    <details class="toggle-prompt" style="margin-bottom: 1rem; background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; padding: 0.75rem;">
        <summary style="cursor: pointer; font-size: 0.875rem; font-weight: 700; color: #2c3e50;">Show system prompt</summary>
        <p id="mbePromptReminder" style="margin: 0.75rem 0 0 0; font-size: 0.875rem; line-height: 1.6; color: #2c3e50; white-space: pre-wrap; font-family: 'Courier New', monospace;"></p>
    </details>

    <!-- Trait form (generated by trait-form-builder.js) -->
    <div id="mbeTraitFormContainer"></div>

    <div style="text-align: right; margin-top: 1.5rem;">
        <button type="button" class="btn btn-primary" id="mbeSubmitBtn" disabled>Submit →</button>
    </div>
</div>

<script>
(function() {
    const session = window.getCurrentSession();
    const promptText = window.getSessionPromptText(session);
    const promptType = window.getSessionPromptType(session);
    const prefix = 's' + session + 'mbe_';

    // Update header
    document.getElementById('mbeTitle').textContent =
        'Session ' + session + ': Model Behavior Evaluation';

    // Show prompt reminder
    document.getElementById('mbePromptReminder').textContent = promptText;

    // Build trait form
    const form = window.buildTraitForm('mbeTraitFormContainer', prefix);
    const btn = document.getElementById('mbeSubmitBtn');

    // Update button text based on session
    btn.textContent = session === 1 ? 'Submit & Continue to Session 2 →' : 'Submit & Continue to Final Survey →';

    // Skip mode
    if (window.experimentSettings && window.experimentSettings.skip) {
        form.autoFill();
        btn.disabled = false;
    }

    // Validate on change
    document.getElementById('mbeTraitFormContainer').addEventListener('change', function() {
        btn.disabled = !form.validate();
    });

    // Submit
    btn.addEventListener('click', async function() {
        if (!form.validate()) return;
        btn.disabled = true;
        btn.textContent = 'Saving...';

        const data = {
            timestamp: new Date().toISOString(),
            session: session,
            promptType: promptType,
            systemPromptShown: promptText,
            traitPredictions: form.collect()
        };

        try {
            if (typeof window.writeTaskData === 'function') {
                await window.writeTaskData('session' + session + '/mbe', data);
            }
        } catch (e) {
            console.warn('MBE save error:', e);
        }

        // Route based on session
        if (session === 1) {
            // After Session 1 MBE → transition to Session 2
            if (typeof window.showSessionTransition === 'function') {
                window.showSessionTransition();
            }
        } else {
            // After Session 2 MBE → final survey
            if (typeof window.showFinalSurvey === 'function') {
                window.showFinalSurvey();
            }
        }
    });
})();
</script>
