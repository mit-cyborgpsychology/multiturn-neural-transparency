<!-- Session Transition: Brief interstitial between Session 1 and Session 2 -->
<div class="session-transition-container" style="max-width: 800px; margin: 0 auto; padding: 1.5rem;">

    <div style="margin-bottom: 1.5rem;">
        <div style="background: linear-gradient(135deg, #1f2937 0%, #374151 100%); padding: 16px 20px; border-radius: 8px; color: white; margin-bottom: 1rem;">
            <h4 style="margin: 0 0 4px 0; font-size: 1.1rem;">Session 1 Complete</h4>
            <p style="margin: 0; font-size: 0.875rem; opacity: 0.9;">Great work! You're halfway through the study.</p>
        </div>
    </div>

    <div style="background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; text-align: center;">
        <div style="font-size: 2.5rem; margin-bottom: 1rem;">&#10003;</div>
        <h5 style="font-weight: 600; margin-bottom: 0.75rem;">Session 1 is done!</h5>
        <p style="font-size: 0.95rem; color: #495057; line-height: 1.6; max-width: 600px; margin: 0 auto;">
            In the next session, you'll repeat the same process with a <strong>different system prompt</strong>.
            You'll read the new prompt, predict its behavioral traits, observe a chatbot conversation,
            and then evaluate the traits again.
        </p>
    </div>

    <div style="text-align: center;">
        <button type="button" class="btn btn-primary btn-lg" id="startSession2Btn">Begin Session 2 →</button>
    </div>
</div>

<script>
(function() {
    document.getElementById('startSession2Btn').addEventListener('click', function() {
        this.disabled = true;
        this.textContent = 'Loading...';

        // Advance to Session 2
        window.advanceToSession2();

        // Navigate to prompt reading for Session 2
        if (typeof window.showPromptReading === 'function') {
            window.showPromptReading();
        }
    });

    // Skip mode: auto-advance after brief delay
    if (window.experimentSettings && window.experimentSettings.skip) {
        setTimeout(function() {
            document.getElementById('startSession2Btn').click();
        }, 500);
    }
})();
</script>
