<!-- Pre-Survey: Before experiment begins -->
<div class="pre-survey-container" style="max-width: 800px; margin: 0 auto; padding: 1.5rem;">

    <!-- Header -->
    <div style="margin-bottom: 1.5rem;">
        <div style="background: linear-gradient(135deg, #1f2937 0%, #374151 100%); padding: 16px 20px; border-radius: 8px; color: white; margin-bottom: 1rem;">
            <h4 style="margin: 0 0 4px 0; font-size: 1.1rem;">Pre-Study Survey</h4>
            <p style="margin: 0; font-size: 0.875rem; opacity: 0.9;">Please answer these questions before we begin.</p>
        </div>
    </div>

    <div style="margin-bottom: 1rem;">
        <h5 style="font-weight: 600; margin-bottom: 0.25rem;">Before You Begin</h5>
        <p style="font-size: 0.875rem; color: #6c757d; margin: 0;">Please answer these questions before viewing the study materials.</p>
    </div>

    <div class="survey-question" style="margin-bottom: 1.25rem;">
        <label class="question-label" style="display: block; font-weight: 500; margin-bottom: 0.5rem;">1. How well do you think you can predict unintended behaviors from an AI system prompt?</label>
        <div class="likert-scale" style="display: flex; gap: 8px; align-items: center; margin-bottom: 0.25rem;">
            <div class="likert-option"><input type="radio" name="pre_q1" value="1" id="pre_q1_1"><label for="pre_q1_1">1</label></div>
            <div class="likert-option"><input type="radio" name="pre_q1" value="2" id="pre_q1_2"><label for="pre_q1_2">2</label></div>
            <div class="likert-option"><input type="radio" name="pre_q1" value="3" id="pre_q1_3"><label for="pre_q1_3">3</label></div>
            <div class="likert-option"><input type="radio" name="pre_q1" value="4" id="pre_q1_4"><label for="pre_q1_4">4</label></div>
            <div class="likert-option"><input type="radio" name="pre_q1" value="5" id="pre_q1_5"><label for="pre_q1_5">5</label></div>
            <div class="likert-option"><input type="radio" name="pre_q1" value="6" id="pre_q1_6"><label for="pre_q1_6">6</label></div>
            <div class="likert-option"><input type="radio" name="pre_q1" value="7" id="pre_q1_7"><label for="pre_q1_7">7</label></div>
        </div>
        <div class="scale-labels" style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #6c757d;"><span>Not at all</span><span>Extremely well</span></div>
    </div>

    <div class="survey-question" style="margin-bottom: 1.25rem;">
        <label class="question-label" style="display: block; font-weight: 500; margin-bottom: 0.5rem;">2. How well do you think you can predict negative unintended behaviors from an AI system prompt?</label>
        <div class="likert-scale" style="display: flex; gap: 8px; align-items: center; margin-bottom: 0.25rem;">
            <div class="likert-option"><input type="radio" name="pre_q2" value="1" id="pre_q2_1"><label for="pre_q2_1">1</label></div>
            <div class="likert-option"><input type="radio" name="pre_q2" value="2" id="pre_q2_2"><label for="pre_q2_2">2</label></div>
            <div class="likert-option"><input type="radio" name="pre_q2" value="3" id="pre_q2_3"><label for="pre_q2_3">3</label></div>
            <div class="likert-option"><input type="radio" name="pre_q2" value="4" id="pre_q2_4"><label for="pre_q2_4">4</label></div>
            <div class="likert-option"><input type="radio" name="pre_q2" value="5" id="pre_q2_5"><label for="pre_q2_5">5</label></div>
            <div class="likert-option"><input type="radio" name="pre_q2" value="6" id="pre_q2_6"><label for="pre_q2_6">6</label></div>
            <div class="likert-option"><input type="radio" name="pre_q2" value="7" id="pre_q2_7"><label for="pre_q2_7">7</label></div>
        </div>
        <div class="scale-labels" style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #6c757d;"><span>Not at all</span><span>Extremely well</span></div>
    </div>

    <div class="survey-question" style="margin-bottom: 1.25rem;">
        <label class="question-label" style="display: block; font-weight: 500; margin-bottom: 0.5rem;">3. AI can be both helpful and harmful. In some cases, AI has provided useful support and guidance, while in others it has spread misinformation, encouraged dangerous behavior, or even contributed to mental health crises. Knowing that AI can have both positive and negative effects, how much do you trust AI systems?</label>
        <div class="likert-scale" style="display: flex; gap: 8px; align-items: center; margin-bottom: 0.25rem;">
            <div class="likert-option"><input type="radio" name="pre_trust" value="1" id="pre_trust_1"><label for="pre_trust_1">1</label></div>
            <div class="likert-option"><input type="radio" name="pre_trust" value="2" id="pre_trust_2"><label for="pre_trust_2">2</label></div>
            <div class="likert-option"><input type="radio" name="pre_trust" value="3" id="pre_trust_3"><label for="pre_trust_3">3</label></div>
            <div class="likert-option"><input type="radio" name="pre_trust" value="4" id="pre_trust_4"><label for="pre_trust_4">4</label></div>
            <div class="likert-option"><input type="radio" name="pre_trust" value="5" id="pre_trust_5"><label for="pre_trust_5">5</label></div>
            <div class="likert-option"><input type="radio" name="pre_trust" value="6" id="pre_trust_6"><label for="pre_trust_6">6</label></div>
            <div class="likert-option"><input type="radio" name="pre_trust" value="7" id="pre_trust_7"><label for="pre_trust_7">7</label></div>
        </div>
        <div class="scale-labels" style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #6c757d;"><span>Not at all</span><span>Completely</span></div>
    </div>

    <div style="text-align: right;">
        <button type="button" class="btn btn-primary" id="preSurveySubmitBtn" disabled>Continue →</button>
    </div>
</div>

<script>
(function() {
    const btn = document.getElementById('preSurveySubmitBtn');

    // Skip mode: auto-fill and enable
    if (window.experimentSettings && window.experimentSettings.skip) {
        document.querySelectorAll('input[name="pre_q1"][value="4"]')[0].checked = true;
        document.querySelectorAll('input[name="pre_q2"][value="4"]')[0].checked = true;
        document.querySelectorAll('input[name="pre_trust"][value="4"]')[0].checked = true;
        btn.disabled = false;
    }

    // Validate: all 3 questions answered
    document.querySelectorAll('input[name="pre_q1"], input[name="pre_q2"], input[name="pre_trust"]').forEach(function(radio) {
        radio.addEventListener('change', function() {
            const q1 = document.querySelector('input[name="pre_q1"]:checked');
            const q2 = document.querySelector('input[name="pre_q2"]:checked');
            const q3 = document.querySelector('input[name="pre_trust"]:checked');
            btn.disabled = !(q1 && q2 && q3);
        });
    });

    // Submit
    btn.addEventListener('click', async function() {
        btn.disabled = true;
        btn.textContent = 'Saving...';

        const data = {
            predictability: parseInt(document.querySelector('input[name="pre_q1"]:checked').value),
            negativePredictability: parseInt(document.querySelector('input[name="pre_q2"]:checked').value),
            trust: parseInt(document.querySelector('input[name="pre_trust"]:checked').value),
            timestamp: new Date().toISOString()
        };

        try {
            const writeTaskData = await window.waitForWriteTaskData();
            await writeTaskData('preSurvey', data);
        } catch (e) {
            console.warn('Pre-survey save error:', e);
        }

        // Initialize session 1 and proceed to prompt reading
        sessionStorage.setItem('currentSession', '1');
        if (window.experimentSettings) window.experimentSettings.currentSession = 1;

        if (typeof window.showPromptReading === 'function') {
            window.showPromptReading();
        }
    });
})();
</script>
