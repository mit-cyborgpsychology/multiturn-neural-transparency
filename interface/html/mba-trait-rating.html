<!-- MBA: Model Behavior Anticipation (trait rating before interaction) -->
<div class="mba-container" style="max-width: 800px; margin: 0 auto; padding: 1.5rem;">

    <!-- Header -->
    <div style="margin-bottom: 1.5rem;">
        <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 16px 20px; border-radius: 8px; color: white; margin-bottom: 1rem;">
            <h4 id="mbaTitle" style="margin: 0 0 4px 0; font-size: 1.1rem;"></h4>
            <p style="margin: 0; font-size: 0.875rem; opacity: 0.9;">Predict the activation level (0-10) for each behavioral trait based on the system prompt you just read.</p>
        </div>
    </div>

    <!-- System prompt reminder -->
    <details open class="toggle-prompt" style="margin-bottom: 1rem; background: #ffffff; border: 1px solid #dee2e6; border-radius: 8px; padding: 0.75rem;">
        <summary style="cursor: pointer; font-size: 0.875rem; font-weight: 700; color: #2c3e50;">Hide system prompt</summary>
        <p id="mbaPromptReminder" style="margin: 0.75rem 0 0 0; font-size: 0.875rem; line-height: 1.6; color: #2c3e50; white-space: pre-wrap; font-family: 'Courier New', monospace;"></p>
    </details>

    <!-- Trait form (generated by trait-form-builder.js) -->
    <div id="mbaTraitFormContainer"></div>

    <div style="text-align: right; margin-top: 1.5rem;">
        <button type="button" class="btn btn-primary" id="mbaSubmitBtn" disabled>Next: Chat Interaction →</button>
    </div>
</div>

<script>
(function() {
    const session = window.getCurrentSession();
    const promptText = window.getSessionPromptText(session);
    const promptType = window.getSessionPromptType(session);
    const prefix = 's' + session + 'mba_';

    // Update header
    document.getElementById('mbaTitle').textContent =
        'Session ' + session + ': Model Behavior Anticipation';

    // Show prompt reminder
    document.getElementById('mbaPromptReminder').textContent = promptText;

    // Build trait form
    const form = window.buildTraitForm('mbaTraitFormContainer', prefix);
    const btn = document.getElementById('mbaSubmitBtn');

    // Skip mode
    if (window.experimentSettings && window.experimentSettings.skip) {
        form.autoFill();
        btn.disabled = false;
    }

    // Validate on change
    document.getElementById('mbaTraitFormContainer').addEventListener('change', function() {
        btn.disabled = !form.validate();
    });

    // Submit
    btn.addEventListener('click', async function() {
        if (!form.validate()) return;
        btn.disabled = true;
        btn.textContent = 'Saving...';

        const data = {
            timestamp: new Date().toISOString(),
            session: session,
            promptType: promptType,
            systemPromptShown: promptText,
            traitPredictions: form.collect()
        };

        try {
            if (typeof window.writeTaskData === 'function') {
                await window.writeTaskData('session' + session + '/mba', data);
            }
        } catch (e) {
            console.warn('MBA save error:', e);
        }

        if (typeof window.showChat === 'function') {
            window.showChat();
        }
    });
})();
</script>
