<!-- Task 1: Baseline Calibration -->
<div class="task1-container" style="max-width: 800px; margin: 0 auto; padding: 1.5rem;">

    <!-- Header -->
    <div style="margin-bottom: 1.5rem;">
        <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 16px 20px; border-radius: 8px; color: white; margin-bottom: 1rem;">
            <h4 style="margin: 0 0 4px 0; font-size: 1.1rem;">Task 1 of 4: Baseline Calibration</h4>
            <p style="margin: 0; font-size: 0.875rem; opacity: 0.9;">Read the system prompt below carefully before proceeding.</p>
        </div>
    </div>

    <!-- System Prompt Display -->
    <div style="background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.25rem;">
        <p style="margin: 0 0 0.75rem 0; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #6c757d;">System Prompt</p>
        <p id="task1CalibrationPrompt" style="margin: 0; font-size: 0.95rem; line-height: 1.7; color: #2c3e50; white-space: pre-wrap; font-family: 'Courier New', monospace;"></p>
    </div>

    <div style="background: #e8f5e9; border-left: 4px solid #4caf50; padding: 12px 16px; border-radius: 4px; margin-bottom: 1.25rem;">
        <p style="margin: 0; font-size: 0.875rem; color: #2e7d32;">
            <strong>Your task:</strong> Read this system prompt carefully. In the next step you will answer a few questions about it.
        </p>
    </div>

    <div style="text-align: right;">
        <button type="button" class="btn btn-primary" id="task1ProceedBtn">Next →</button>
    </div>

</div>

<script>
(function() {
    'use strict';

    // ── Populate calibration prompt ──────────────────────────────────────────
    const content = window.STUDY_CONTENT;
    if (content) {
        document.getElementById('task1CalibrationPrompt').textContent = content.CALIBRATION_PROMPT;
    }

    // ── Proceed to Task 2 ────────────────────────────────────────────────────
    document.getElementById('task1ProceedBtn').addEventListener('click', async function() {
        // Save Task 1 view record to Firebase
        try {
            if (typeof window.writeTaskData === 'function') {
                await window.writeTaskData('task1BaselineCalibration', {
                    timestamp: new Date().toISOString(),
                    systemPromptShown: content ? content.CALIBRATION_PROMPT : ''
                });
            }
        } catch (err) {
            console.warn('Firebase write failed (continuing anyway):', err);
        }

        if (typeof window.showTask2 === 'function') {
            window.showTask2();
        } else {
            console.warn('window.showTask2 not defined');
        }
    });

    console.log('✅ Task 1 calibration page ready');
})();
</script>
